<app-nav />

<button
  class="option-pill-access blue-button-access return-button"
  routerLink="/especialidades"
>
  < Volver
</button>

<div class="login-page">
  <h1>Sacando turno para {{especialidadNombre}}</h1>
  <form
    action="#"
    class="form"
    [formGroup]="turnoForm"
    (ngSubmit)="finalizarTurno()"
  >
    <h2>Seleccione un médico</h2>
    <div *ngIf="!_medicoService.medicos || _medicoService.medicos.length === 0" class="title flex-column" style="margin: 2rem 0; align-items: center;">
      <span class="material-symbols-rounded" style="color: var(--rojo); font-size: 80px; margin-bottom: 1rem;">
          cancel
      </span>
      <h1 style="text-align: center;">No hay médicos.</h1>
      <h2 style="font-weight: 400; text-align: center;">No hay médicos disponibles para esta especialidad.</h2>
    </div>
    <div class="card-container" *ngIf="_medicoService.medicos && _medicoService.medicos.length > 0">
      <div
        *ngFor="let medico of _medicoService.medicos"
        class="card"
        (click)="cargarTurnos(medico._id); getDoctor(medico.apellido.toString(), medico.nombre.toString())"
      >
        <label for="{{ medico._id }}">
          <input
            type="radio"
            name="medico"
            id="{{ medico._id }}"
            class="card-input-element"
          />
          <div class="card-input">
            <div class="turno-titulo-text">
              {{ medico.apellido }} {{ medico.nombre }}
            </div>
            <div class="turno-text">
              Turnos Disponibles: {{ medico.turnosDisponibles }}
            </div>
          </div>
        </label>
      </div>
    </div>

    <h2>Seleccione un turno</h2>
    <div *ngIf="!_medicoService.turnos || _medicoService.turnos.length === 0" class="title flex-column" style="margin: 2rem 0; align-items: center;">
      <span class="material-symbols-rounded" style="color: var(--celeste); font-size: 80px; margin-bottom: 1rem;">
          info
      </span>
      <h1 style="text-align: center;">Seleccione un médico.</h1>
      <h2 style="font-weight: 400; text-align: center;">Seleccione un médico arriba para ver sus turnos.</h2>
    </div>
    <div class="card-container" *ngIf="_medicoService.turnos && _medicoService.turnos.length > 0">
      <div
        *ngFor="let turno of _medicoService.turnos"
        class="card"
        (click)="formatearFecha(turno.fecha.toString());getConsultorio(turno.consultorio.toString());getEspecialidad(turno.especialidad_id.nombreEsp.toString())"
      >
        <label for="{{ turno._id }}">
          <input
            formControlName="turno"
            type="radio"
            value="{{ turno._id }}"
            name="turno"
            id="{{ turno._id }}"
            class="card-input-element"
          />
          <div class="card-input">
            <ul>
              <li class="turno-titulo-text">
                {{ turno.fecha | date : "EEEE dd/MM" }}, a las
                {{ turno.fecha | date : "shortTime" }}
              </li>
              <li class="turno-text">Duración: {{ turno.duracion }} min</li>
              <li class="turno-text">Lugar: {{ turno.consultorio }}</li>
              <li class="turno-text">
                <b>Consultorio {{ turno.consultorio }} </b>
                </li>
                <li class="turno-text" *ngIf="turno.observacionAdmin" style="color: var(--rojo); font-weight: bold;">
                  Aviso: {{ turno.observacionAdmin }}
              </li>
            </ul>
          </div>
        </label>
      </div>
    </div>

    <h2>Seleccione sus Obras Sociales</h2>
    <label for="user-dni">Obra Social 1</label>
    <select name="obra" id="obra" formControlName="obra1" required>
      <option value="68ae8cf749e4a8883f1ffb06" selected="selected">PARTICULAR</option>
      <option value="{{ obra._id }}" *ngFor="let obra of _obraService.obras">
        {{ obra.nombreOS }}
      </option>
    </select>
    <div *ngIf="obra1">
      <label for="user-dni">Obra Social 2</label>

      <select name="obra2" id="obra2" formControlName="obra2">
       			
        <option
          value="{{ obra1._id }}"
          *ngFor="let obra1 of _obraService.obras1"
        >
          {{ obra1.nombreOS }}
        </option>
       
				
      </select>
    </div>
    <div *ngIf="obra2">
      <label for="user-dni">Obra Social 3</label>
      <select name="obra2" id="obra2" formControlName="obra3">
        
        <option
          value="{{ obra2._id }}"
          *ngFor="let obra2 of _obraService.obras2"
        >
          {{ obra2.nombreOS }}
        </option>
      </select>
    </div>
    <div class="flex-row">
      <button
        *ngIf="!obra2"
        type="button"
        class="option-pill-access green-button-access"
        style="margin-bottom: 2rem"
        (click)="agregarObra()"
      >
        + Sumar Obra
      </button>
      <button
        *ngIf="obra1"
        type="button"
        class="option-pill-access red-button-access"
        style="margin-bottom: 2rem"
        (click)="sacarObra()"
      >
        - Quitar Obra
      </button>
    </div>
     <div class="flex-column" style="margin-bottom: 2rem">
      <label for="user-observacion">Observacion</label>
      <textarea formControlName="observacion" style="font-size: 22px" name="" id="" placeholder="Si el turno es para su hija/o o para otra persona, complete los datos de quien recibirá la atención médica APELLIDO, NOMBRE Y DNI"></textarea>
    </div>
    <div class="flex-column">
      <button class="option-pill-access blue-button-access">
        Solicitar Turno
      </button>
    </div>
  </form>
</div>
